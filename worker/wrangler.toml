name = "npsp-ai-search"
main = "src/worker.js"
# Matches the live deployment's compatibility_date exactly (confirmed via
# `wrangler versions view <id> --json` 2026-08-11). Do NOT bump this to
# "today" casually — a newer compatibility_date can change runtime defaults
# even with identical source. Treat bumping it as its own deliberate,
# tested change, separate from this reconciliation.
compatibility_date = "2024-12-01"

[ai]
binding = "AI"

# Confirmed live 2026-08-11 via `wrangler versions view <id> --json`.
[[kv_namespaces]]
binding = "CACHE"
id = "b36b0f495c5b4faab3863a19ddd7d53d"

# Confirmed live 2026-08-11. Shared across all 10 Product Explorer products.
[vars]
ALLOWED_ORIGINS = "https://epugach.github.io,http://localhost:8000,http://localhost:3000"

# SHEETS_LOG_URL is ALSO a plaintext var on the live worker (not a secret,
# despite what this file previously assumed) — but this repo is public, and
# that value is a working Google Apps Script webhook URL. See the "Open
# question" in README.md before adding it here.
